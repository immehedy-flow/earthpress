name: Bug report
description: Something in EarthPress does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include private photos; a synthetic
        file that reproduces the problem is ideal.

  - type: input
    id: version
    attributes:
      label: EarthPress version
      description: Shown in the title bar or in the installer filename.
      placeholder: 2.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a PNG with ...
        2. Choose WebP at ...
        3. Click Convert
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error message from the app or `~/.earthpress/earthpress.log`.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Sample files or settings
      description: A small synthetic image, the output format, quality, size mode and any crop settings.
    validations:
      required: false
